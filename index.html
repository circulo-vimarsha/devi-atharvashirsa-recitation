<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16120d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="देवी">
<title>Devī Atharvaśīrṣa</title>
<meta name="description" content="Recitación completa del Devī Atharvaśīrṣa: el texto se ilumina y avanza con la voz.">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root {
  --bg: #f6f1e7; --panel: #fffaf0; --text: #2a2218; --dim: #7b6d5a; --line: #e2d7c3;
  --accent: #a3361f; --glow: #f3dfb8; --now: #8a2a14; --done: #4d4234;
  --deva: "Noto Serif Devanagari", "Kohinoor Devanagari", "Devanagari Sangam MN", serif;
  --serif: "Noto Serif", Georgia, serif;
  --size: 30px; --bar: 132px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16120d; --panel: #211b14; --text: #efe5d3; --dim: #a1937e; --line: #3a3127;
    --accent: #e59a5c; --glow: #4a3420; --now: #ffcf8f; --done: #cbbda6;
  }
}
:root[data-theme="dark"] {
  --bg: #16120d; --panel: #211b14; --text: #efe5d3; --dim: #a1937e; --line: #3a3127;
  --accent: #e59a5c; --glow: #4a3420; --now: #ffcf8f; --done: #cbbda6;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--serif); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { max-width: 820px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); text-align: center; }
header h1 { margin: 0; font: 600 clamp(30px, 6vw, 44px)/1.3 var(--deva); color: var(--accent); }
header p { margin: 4px 0 0; color: var(--dim); font-style: italic; }
#who { font-style: normal; font-size: 14px; }

main { max-width: 820px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-right)) calc(var(--bar) + 40vh) max(16px, env(safe-area-inset-left)); }
.verse { margin: 0 0 22px; padding: 6px 0 0; border-top: 1px solid var(--line); scroll-margin-top: 30vh; }
.verse .num { display: block; text-align: center; color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin: 2px 0 6px; }
.verse.silent { opacity: .45; }
.verse.silent .num::after { content: " · " attr(data-silent); text-transform: none; letter-spacing: 0; }
.line { padding: 4px 10px; margin: 0 -10px; border-radius: 14px; transition: background .25s; }
.line.now { background: color-mix(in srgb, var(--glow) 55%, transparent); }
.deva { font: 400 var(--size)/1.6 var(--deva); display: flex; flex-wrap: wrap; column-gap: .32em; }
.w { border-radius: 6px; padding: 0 .06em; transition: color .15s, background .15s; }
.timed .w { cursor: pointer; }
.w.done { color: var(--done); }
.w.now { color: var(--now); background: var(--glow); }
.p { color: var(--dim); }
.iast { color: var(--dim); font-size: calc(var(--size) * .5); line-height: 1.45; padding-bottom: 2px; }
body.noiast .iast { display: none; }
body.playing .verse:not(.silent) .w:not(.done):not(.now) { opacity: .82; }

/* the player, at the bottom on a phone, wider and centred on a tablet or laptop */
#player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--panel) 94%, transparent); border-top: 1px solid var(--line); -webkit-backdrop-filter: saturate(1.2) blur(10px); backdrop-filter: saturate(1.2) blur(10px); padding: 8px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
#player .in { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.row { display: flex; align-items: center; gap: 8px; }
#seek { flex: 1; width: 0; min-width: 0; accent-color: var(--accent); height: 28px; }
.time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; min-width: 42px; text-align: center; }
.ctl { min-width: 44px; height: 44px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
.ctl:hover { background: var(--line); }
#play { min-width: 56px; height: 56px; border-radius: 28px; background: var(--accent); color: var(--bg); font-size: 22px; }
#play:hover { background: var(--accent); filter: brightness(1.08); }
.speed { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.speed input { flex: 1; width: 0; min-width: 60px; accent-color: var(--accent); }
.speed output { font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; font-size: 14px; }
.speed label { color: var(--dim); font-size: 13px; }
.toggles { display: flex; gap: 2px; }
.toggles button { height: 36px; min-width: 40px; padding: 0 8px; border-radius: 18px; font-size: 13px; color: var(--dim); border: 1px solid transparent; }
.toggles button[aria-pressed="true"] { color: var(--text); border-color: var(--line); background: var(--bg); }
#follow { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar) + 12px + env(safe-area-inset-bottom)); z-index: 6; background: var(--accent); color: var(--bg); border-radius: 20px; padding: 8px 16px; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.2); display: none; }
#follow.show { display: block; }
#note { color: var(--dim); font-size: 13px; text-align: center; margin: 0; }
#lock { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
#lock[hidden] { display: none; }
#lock form { width: 100%; max-width: 360px; text-align: center; display: grid; gap: 14px; }
#lock h1 { margin: 0; font: 600 clamp(30px, 8vw, 42px)/1.3 var(--deva); color: var(--accent); }
#lock p { margin: 0; color: var(--dim); }
#lock input { font: 18px var(--serif); padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); width: 100%; text-align: center; }
#lock button { font-size: 17px; padding: 12px; border-radius: 12px; background: var(--accent); color: var(--bg); }
#lock button:disabled { opacity: .6; cursor: default; }
#lockMsg { min-height: 1.5em; font-size: 14px; }
#lockMsg.bad { color: var(--accent); }
footer { max-width: 820px; margin: 0 auto; color: var(--dim); font-size: 13px; text-align: center; padding: 0 16px 20px; }

/* phone: two rows (transport, then speed + toggles) */
@media (max-width: 599px) {
  :root { --size: 25px; --bar: 150px; }
  .row.second { flex-wrap: wrap; }
  .speed { flex-basis: 100%; }
  .toggles { margin: 0 auto; }
  .row { gap: 4px; }
  .ctl { min-width: 40px; }
  .time { min-width: 34px; font-size: 12px; }
  .speed label { display: none; }
}
/* tablet and laptop: one roomy row */
@media (min-width: 600px) {
  :root { --size: 32px; --bar: 120px; }
}
@media (min-width: 1000px) {
  :root { --size: 34px; }
}
@media (prefers-reduced-motion: reduce) { .line, .w { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>श्रीदेव्यथर्वशीर्षम्</h1>
  <p><span data-t="sub">Recitación completa</span> · <span id="who"></span></p>
</header>
<div id="lock">
  <form id="lockForm" autocomplete="off">
    <h1>श्रीदेव्यथर्वशीर्षम्</h1>
    <p data-t="ask">Escribe la contraseña del círculo.</p>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Contraseña" required>
    <button id="enter" type="submit" data-t="enter">Entrar</button>
    <p id="lockMsg" role="status"></p>
  </form>
</div>
<main id="text" aria-live="off"></main>
<footer><p id="foot"></p></footer>
<button id="follow" type="button" data-t="follow">Seguir la voz</button>

<div id="player" role="region" aria-label="Recitación">
  <div class="in">
    <div class="row">
      <button class="ctl" id="prev" type="button" aria-label="Línea anterior" title="Línea anterior (←)">⏮</button>
      <button class="ctl" id="play" type="button" aria-label="Reproducir" title="Reproducir / pausa (espacio)">▶</button>
      <button class="ctl" id="next" type="button" aria-label="Línea siguiente" title="Línea siguiente (→)">⏭</button>
      <span class="time" id="cur">0:00</span>
      <input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="Posición">
      <span class="time" id="dur">0:00</span>
    </div>
    <div class="row second">
      <div class="speed">
        <label for="rate" data-t="speed">Velocidad</label>
        <button class="ctl" id="slower" type="button" aria-label="Más lento" title="Más lento (−)">−</button>
        <input id="rate" type="range" min="0.5" max="1.5" step="0.05" value="1">
        <button class="ctl" id="faster" type="button" aria-label="Más rápido" title="Más rápido (+)">+</button>
        <output id="rateOut" for="rate">1.00×</output>
      </div>
      <div class="toggles">
        <button id="tIast" type="button" aria-pressed="true" title="Transliteración">IAST</button>
        <button id="tSmall" type="button" aria-label="Letra más pequeña">A−</button>
        <button id="tBig" type="button" aria-label="Letra más grande">A+</button>
        <button id="tLang" type="button" title="Language / idioma">EN</button>
      </div>
    </div>
    <p id="note"></p>
  </div>
</div>

<audio id="audio" preload="auto"></audio>
<script>
'use strict';
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem('devi.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('devi.' + k, JSON.stringify(v)); } catch {} },
};
const T = {
  es: { sub: 'Recitación completa', speed: 'Velocidad', follow: 'Seguir la voz', play: 'Reproducir', pause: 'Pausa',
        silent: 'no está en esta grabación', verse: 'Verso', ask: 'Escribe la contraseña del círculo.', enter: 'Entrar', wrong: 'Esa no es la contraseña.', opening: 'Abriendo…', loading: p => `Cargando la voz… ${p}%`, failed: 'No se pudo cargar. Revisa la conexión y vuelve a intentarlo.', viniyoga: 'Viniyoga',
        note: () => 'Toca una palabra para escuchar desde ahí.',
        foot: 'El texto se ilumina y avanza con la voz. Teclado: espacio, ← →, + −.' },
  en: { sub: 'Whole recitation', speed: 'Speed', follow: 'Follow the voice', play: 'Play', pause: 'Pause',
        silent: 'not in this recording', verse: 'Verse', ask: 'Type the circle’s password.', enter: 'Enter', wrong: 'That is not the password.', opening: 'Opening…', loading: p => `Loading the voice… ${p}%`, failed: 'Could not load. Check the connection and try again.', viniyoga: 'Viniyoga',
        note: () => 'Tap a word to hear it from there.',
        foot: 'The text lights up and scrolls with the voice. Keys: space, ← →, + −.' },
};
let lang = store.get('lang', (navigator.language || 'es').startsWith('es') ? 'es' : 'en');
const audio = $('#audio');
let words = [], lineEls = [], cur = -1, curLine = null, following = true, userScrollUntil = 0, raf = 0, timing = null;

function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function listVerses(vs) {   // [1,2,3,7] → "1–3, 7"
  const out = []; let a = null, b = null;
  for (const v of vs) { if (a !== null && v === b + 1) b = v; else { if (a !== null) out.push(a === b ? a : `${a}–${b}`); a = b = v; } }
  if (a !== null) out.push(a === b ? a : `${a}–${b}`);
  return (lang === 'es' ? (vs.length > 1 ? 'los versos ' : 'el verso ') : (vs.length > 1 ? 'verses ' : 'verse ')) + out.join(', ');
}

function draw(text) {
  const main = $('#text'); main.textContent = '';
  const voiced = new Set(timing.verses);
  const timedLines = new Set(timing.words.map(w => `${w.v}.${w.l}`));
  for (const v of text.verses) {
    const sec = document.createElement('section');
    sec.className = 'verse' + (voiced.has(v.n) ? '' : ' silent');
    const num = document.createElement('span'); num.className = 'num';
    num.dataset.silent = T[lang].silent;
    num.textContent = v.n === 0 ? T[lang].viniyoga : `${T[lang].verse} ${v.n}`;
    sec.append(num);
    v.lines.forEach((ln, li) => {
      const div = document.createElement('div');
      div.className = 'line' + (timedLines.has(`${v.n}.${li}`) ? ' timed' : '');
      const d = document.createElement('div'); d.className = 'deva'; d.lang = 'sa';
      for (const p of ln.pieces) {
        const s = document.createElement('span');
        if ('w' in p) { s.className = 'w'; s.textContent = p.w; s.id = `w${v.n}-${li}-${p.i}`; }
        else { s.className = 'p'; s.textContent = p.p; }
        d.append(s);
      }
      const i = document.createElement('div'); i.className = 'iast'; i.lang = 'sa-Latn'; i.textContent = ln.iast;
      div.append(d, i); sec.append(div);
    });
    main.append(sec);
  }
  words = timing.words.map(w => ({ ...w, el: document.getElementById(`w${w.v}-${w.l}-${w.w}`) }));
  words.forEach((w, k) => { if (w.el) { w.el.dataset.k = k; w.el.closest('.line').classList.add('timed'); } });
  lineEls = [];   // timed lines in order, each with its first word
  for (const [k, w] of words.entries()) { const el = w.el?.closest('.line'); if (el && !lineEls.some(x => x.el === el)) lineEls.push({ el, k }); }
  cur = -1; curLine = null; paint(audio.currentTime || 0, true);
}

function labels() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T[lang][e.dataset.t]; });
  $('#tLang').textContent = lang === 'es' ? 'EN' : 'ES';
  if (!$('#play').disabled) $('#note').textContent = T[lang].note();
  $('#foot').textContent = T[lang].foot;
  $('#play').setAttribute('aria-label', audio.paused ? T[lang].play : T[lang].pause);
}

// which word sounds at t: the last one begun (it stays lit until the next begins, through the pauses)
function at(t) {
  let lo = 0, hi = words.length - 1, k = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (words[m].t0 <= t + 0.03) { k = m; lo = m + 1; } else hi = m - 1; }
  return k;
}
function paint(t, force) {
  const k = at(t);
  if (k === cur && !force) return;
  const from = Math.min(k, cur), to = Math.max(k, cur);
  for (let j = Math.max(0, force ? 0 : from); j <= (force ? words.length - 1 : to); j++) {
    const el = words[j]?.el; if (!el) continue;
    el.classList.toggle('done', j < k);
    el.classList.toggle('now', j === k);
  }
  cur = k;
  const line = k >= 0 ? words[k].el?.closest('.line') : null;
  if (line !== curLine) {
    curLine?.classList.remove('now'); line?.classList.add('now'); curLine = line;
    if (line && following && Date.now() > userScrollUntil) place(line);
  }
}
function place(el, instant) {   // the voice's line at about a third of the screen, above the player
  const r = el.getBoundingClientRect();
  const room = innerHeight - $('#player').offsetHeight;
  const y = scrollY + r.top - Math.max(16, room * 0.32);
  autoScrolling = Date.now() + 900;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  scrollTo({ top: Math.max(0, y), behavior: instant || reduce ? 'auto' : 'smooth' });
}
let autoScrolling = 0;
function userMoved() {
  if (Date.now() < autoScrolling || audio.paused) return;
  userScrollUntil = Date.now() + 6000; $('#follow').classList.add('show');
}
addEventListener('wheel', userMoved, { passive: true });
addEventListener('touchmove', userMoved, { passive: true });
addEventListener('keydown', e => { if (['PageUp', 'PageDown', 'Home', 'End'].includes(e.key)) userMoved(); });
$('#follow').onclick = () => { userScrollUntil = 0; $('#follow').classList.remove('show'); if (curLine) place(curLine); };
setInterval(() => { if (userScrollUntil && Date.now() > userScrollUntil) { userScrollUntil = 0; $('#follow').classList.remove('show'); if (curLine && !audio.paused) place(curLine); } }, 1000);

function tick() {
  paint(audio.currentTime);
  if (!seeking) { $('#seek').value = audio.currentTime; $('#cur').textContent = fmt(audio.currentTime); }
  raf = audio.paused ? 0 : requestAnimationFrame(tick);
}
let wake = null;
async function keepAwake(on) {
  try { if (on && 'wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); }
        else if (!on && wake) { await wake.release(); wake = null; } } catch {}
}
audio.addEventListener('play', () => { document.body.classList.add('playing'); $('#play').textContent = '❚❚'; labels(); if (!raf) raf = requestAnimationFrame(tick); keepAwake(true); if (curLine) place(curLine); });
audio.addEventListener('pause', () => { $('#play').textContent = '▶'; labels(); keepAwake(false); });
audio.addEventListener('error', () => { $('#note').textContent = lang === 'es' ? 'No se pudo cargar el audio.' : 'The audio could not be loaded.'; });
audio.addEventListener('ended', () => { document.body.classList.remove('playing'); });
audio.addEventListener('loadedmetadata', () => { $('#seek').max = audio.duration; $('#dur').textContent = fmt(audio.duration); });
audio.addEventListener('seeked', () => { if (pendingT === null) paint(audio.currentTime); });
let pendingT = null;   // a moment asked for before the audio can seek
document.addEventListener('visibilitychange', () => { if (!document.hidden && !audio.paused) keepAwake(true); });

function toggle() { if (audio.paused) { if (pendingT !== null && audio.readyState >= 1) { audio.currentTime = pendingT; pendingT = null; } if (audio.ended) audio.currentTime = 0; audio.play().catch(() => {}); } else audio.pause(); }
function go(k) { k = Math.max(0, Math.min(words.length - 1, k)); audio.currentTime = Math.max(0, words[k].t0 - 0.15); paint(audio.currentTime, true); userScrollUntil = 0; $('#follow').classList.remove('show'); if (curLine) place(curLine); }
function stepLine(d) {
  if (!lineEls.length) return;
  let i = lineEls.findIndex(x => x.el === curLine);
  if (i < 0) i = d > 0 ? -1 : 0;
  else if (d < 0 && audio.currentTime - words[lineEls[i].k].t0 > 1.5) d = 0;   // first back: the start of this line
  go(lineEls[Math.max(0, Math.min(lineEls.length - 1, i + d))].k);
}
$('#play').onclick = toggle;
$('#prev').onclick = () => stepLine(-1);
$('#next').onclick = () => stepLine(1);
$('#text').addEventListener('click', e => {
  const w = e.target.closest('.w'); if (!w || w.dataset.k === undefined) return;
  go(+w.dataset.k); if (audio.paused) audio.play().catch(() => {});
});

let seeking = false;
$('#seek').addEventListener('input', e => { seeking = true; $('#cur').textContent = fmt(+e.target.value); });
$('#seek').addEventListener('change', e => { audio.currentTime = +e.target.value; seeking = false; userScrollUntil = 0; $('#follow').classList.remove('show'); paint(audio.currentTime, true); if (curLine) place(curLine); });

function setRate(r) {
  r = Math.round(Math.max(0.5, Math.min(1.5, r)) * 20) / 20;
  audio.playbackRate = audio.defaultPlaybackRate = r;
  audio.preservesPitch = audio.mozPreservesPitch = audio.webkitPreservesPitch = true;   // slower, not lower
  $('#rate').value = r; $('#rateOut').textContent = r.toFixed(2) + '×'; store.set('rate', r);
}
$('#rate').addEventListener('input', e => setRate(+e.target.value));
$('#slower').onclick = () => setRate(audio.playbackRate - 0.05);
$('#faster').onclick = () => setRate(audio.playbackRate + 0.05);

function setSize(px) { px = Math.max(18, Math.min(56, px)); document.documentElement.style.setProperty('--size', px + 'px'); store.set('size', px); }
const baseSize = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--size'));
$('#tSmall').onclick = () => { setSize(baseSize() - 2); if (curLine) place(curLine, true); };
$('#tBig').onclick = () => { setSize(baseSize() + 2); if (curLine) place(curLine, true); };
function setIast(on) { document.body.classList.toggle('noiast', !on); $('#tIast').setAttribute('aria-pressed', on); store.set('iast', on); }
$('#tIast').onclick = () => setIast(document.body.classList.contains('noiast'));
$('#tLang').onclick = () => { lang = lang === 'es' ? 'en' : 'es'; store.set('lang', lang); labels(); draw(textData); };

addEventListener('keydown', e => {
  if (e.target.matches('input') && e.key !== ' ') return;
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); stepLine(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); stepLine(1); }
  else if (e.key === '+' || e.key === '=') setRate(audio.playbackRate + 0.05);
  else if (e.key === '-' || e.key === '_') setRate(audio.playbackRate - 0.05);
});

// the player's height can change (phone rotation, wrapping): keep the last lines reachable
new ResizeObserver(() => document.documentElement.style.setProperty('--bar', $('#player').offsetHeight + 'px')).observe($('#player'));

// ── the lock: everything but this page is stored encrypted (tools/seal.py); the password opens it here ──
let textData = null, lockInfo = null;
async function keyFor(pw) {
  lockInfo = lockInfo || await (await fetch('sealed/lock.json', { cache: 'no-cache' })).json();
  const salt = new Uint8Array(lockInfo.salt.match(/../g).map(h => parseInt(h, 16)));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: lockInfo.iterations }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
const open_ = (key, buf) => crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(buf, 0, 12) }, key, new Uint8Array(buf, 12));
async function fetchBytes(url, onProgress) {
  const r = await fetch(url); if (!r.ok) throw new Error(r.status);
  const total = +r.headers.get('content-length') || 0;
  if (!r.body || !total) return r.arrayBuffer();
  const reader = r.body.getReader(), buf = new Uint8Array(total); let got = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; buf.set(value, got); got += value.length; onProgress(Math.min(99, Math.round(got / total * 100))); }
  return buf.buffer.slice(0, got);
}
function lockSay(msg, bad) { $('#lockMsg').textContent = msg; $('#lockMsg').className = bad ? 'bad' : ''; }
async function unlock(pw, quiet) {
  $('#enter').disabled = true; lockSay(T[lang].opening);
  let key, data;
  try { key = await keyFor(pw); data = JSON.parse(new TextDecoder().decode(await open_(key, await (await fetch('sealed/data.bin')).arrayBuffer()))); }
  catch (e) {
    $('#enter').disabled = false;
    if (e && e.name === 'OperationError') { store.set('pw', null); lockSay(quiet ? '' : T[lang].wrong, true); $('#pw').select(); }
    else lockSay(T[lang].failed, true);
    return;
  }
  store.set('pw', pw);
  $('#lock').hidden = true;
  start(data.text, data.timing);
  try {
    $('#note').textContent = T[lang].loading(0); $('#play').disabled = true;
    const buf = await fetchBytes('sealed/audio.bin', p => { $('#note').textContent = T[lang].loading(p); });
    audio.src = URL.createObjectURL(new Blob([await open_(key, buf)], { type: lockInfo.audio || 'audio/mpeg' }));   // a blob seeks everywhere, Safari too
    $('#play').disabled = false; labels();
  } catch { $('#note').textContent = T[lang].failed; }
}
$('#lockForm').addEventListener('submit', e => { e.preventDefault(); unlock($('#pw').value.trim()); });

function start(text, tm) {
  textData = text; timing = tm;
  $('#who').textContent = tm.who || '';
  setRate(store.get('rate', 1));
  const size = store.get('size', null); if (size) setSize(size);
  setIast(store.get('iast', true));
  draw(text); labels();
  const deep = /^#t=(\d+(?:\.\d+)?)$/.exec(location.hash);   // a link to a moment: …/#t=42
  if (deep) {
    const t = +deep[1]; paint(t, true); if (curLine) place(curLine, true);
    $('#seek').value = t; $('#cur').textContent = fmt(t);
    pendingT = t; audio.addEventListener('loadedmetadata', () => { audio.currentTime = pendingT; pendingT = null; }, { once: true });
  }
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: 'Devī Atharvaśīrṣa', artist: tm.who || '', artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }] });
    const ms = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
    ms('play', () => audio.play()); ms('pause', () => audio.pause());
    ms('previoustrack', () => stepLine(-1)); ms('nexttrack', () => stepLine(1));
    ms('seekbackward', () => { audio.currentTime -= 10; }); ms('seekforward', () => { audio.currentTime += 10; });
  }
}

document.querySelectorAll('#lock [data-t]').forEach(e => { e.textContent = T[lang][e.dataset.t]; });
if (!window.crypto || !crypto.subtle) lockSay(T[lang].failed, true);
else if (store.get('pw', null)) unlock(store.get('pw', null), true);   // this device already knows it
else $('#pw').focus();
</script>
</body>
